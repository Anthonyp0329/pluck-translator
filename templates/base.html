<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Translations{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f4f5;
      --card: #ffffff;
      --border: #e4e4e7;
      --text: #18181b;
      --muted: #71717a;
      --primary: #4f46e5;
      --primary-bg: #eef2ff;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    nav {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 24px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav .brand {
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.3px;
    }

    nav a {
      font-size: 14px;
      color: var(--muted);
      text-decoration: none;
    }

    nav a:hover { color: var(--text); }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
    h2 { font-size: 17px; font-weight: 600; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      text-decoration: none;
      transition: background 0.1s, opacity 0.1s;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { opacity: 0.88; }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border-color: var(--border);
    }
    .btn-ghost:hover { background: var(--bg); color: var(--text); }

    .btn-danger { background: var(--danger-bg); color: var(--danger); border-color: #fecaca; }
    .btn-danger:hover { background: #fee2e2; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 500;
    }

    .badge-primary { background: var(--primary-bg); color: var(--primary); }
    .badge-success { background: var(--success-bg); color: var(--success); }
    .badge-muted { background: var(--border); color: var(--muted); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav>
    <a class="brand" href="/">🌐 Translations</a>
    <a href="/">Languages</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
